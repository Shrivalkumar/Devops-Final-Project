apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "deployflow.fullname" . }}-frontend, labels: {app: deployflow-frontend}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: deployflow-frontend}}
  template:
    metadata: {labels: {app: deployflow-frontend}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        ports: [{containerPort: 8080}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "deployflow.fullname" . }}-frontend-nginx
