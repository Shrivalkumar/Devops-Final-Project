{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: {{ include "deployflow.fullname" . }}}
spec:
  ingressClassName: nginx
  rules:
  -
{{ if .Values.ingress.host }}
    host: {{ .Values.ingress.host | quote }}
{{ end }}
    http:
      paths:
      - {path: /api, pathType: Prefix, backend: {service: {name: {{ include "deployflow.fullname" . }}-backend, port: {number: 8000}}}}
      - {path: /, pathType: Prefix, backend: {service: {name: {{ include "deployflow.fullname" . }}-frontend, port: {number: 80}}}}
{{- end }}
