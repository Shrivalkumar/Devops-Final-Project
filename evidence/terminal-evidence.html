    * { box-sizing: border-box; }

    .terminal { border:1px solid #34405f; border-radius:15px; overflow:hidden; box-shadow:0 24px 70px #0008; background:#090d16; }
    .bar { height:42px; background:#181f31; display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid #2b3550; }
    .dot { width:11px; height:11px; border-radius:50%; background:#fb7185; } .dot:nth-child(2){background:#fbbf24}.dot:nth-child(3){background:#34d399}
    .title { margin-left:12px; color:#b8c2dd; font-size:12px; }
    pre { margin:0; padding:22px 26px 26px; min-height:590px; white-space:pre-wrap; font:14px/1.47 "SFMono-Regular",Consolas,monospace; color:#dce5ff; }
    .cmd { color:var(--cyan); } .ok { color:var(--green); font-weight:700; } .dim { color:#8f9ab7; } .violet { color:var(--violet); }
    footer { display:flex; justify-content:space-between; margin-top:14px; color:var(--muted); font-size:11px; }
  </style>
</head>
